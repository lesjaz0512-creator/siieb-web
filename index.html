<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicación / Formulario - Soporte y Soluciones TI</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --card-bg: #161b22;
      --cyan-neon: #00f3ff;
      --purple-accent: #a855f7;
      --pink-accent: #ec4899;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-glow: rgba(0, 243, 255, 0.3);
      --input-bg: #0d1117;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Contenedor estilo Dark Mode */
    .banner-container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.15),
                  0 0 50px rgba(168, 85, 247, 0.1);
      position: relative;
      overflow: hidden;
    }

    /* Detalle de luz neón superior */
    .banner-container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      height: 4px;
      background: linear-gradient(90deg, var(--cyan-neon), var(--purple-accent), var(--pink-accent));
    }

    /* Encabezado */
    .header {
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--cyan-neon);
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid var(--cyan-neon);
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .title {
      color: var(--text-main);
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .title span {
      color: var(--cyan-neon);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .subtitle {
      color: var(--text-muted);
      margin-top: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Formulario Formspree */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      background-color: var(--input-bg);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--cyan-neon);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 90px;
    }

    /* Botón de envío */
    .cta-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--cyan-neon), #00b4d8);
      color: #040d1a;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .cta-button:hover {
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="banner-container">
    <div class="header">
      <span class="badge">Punto de Venta & TI</span>
      <h1 class="title">Lleva la gestión de tu negocio al <span>siguiente nivel</span></h1>
      <p class="subtitle">Déjanos tus datos para agendar una asesoría sobre tu sistema de Punto de Venta o soporte de TI.</p>
    </div>

    <!-- Integración del Endpoint de Formspree -->
    <form class="contact-form" action="https://formspree.io/f/maewbqye" method="POST">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono / WhatsApp</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ej. 442 123 4567" required>
      </div>

      <div class="form-group">
        <label for="mensaje">¿Qué servicio te interesa o qué requiere tu negocio?</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escribe aquí los detalles de tu consulta..." required></textarea>
      </div>

      <button type="submit" class="cta-button">Enviar Solicitud</button>
    </form>
  </div>

</body>
</html>
